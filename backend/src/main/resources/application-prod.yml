server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: rural-edu-backend
  datasource:
    url: ${DATABASE_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:rural_edu_db}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
    username: ${DATABASE_USERNAME:${MYSQLUSER:root}}
    password: ${DATABASE_PASSWORD:${MYSQLPASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForRuralEduPlatformProductionMinimum256BitsLong2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ./uploads
  cors:
    allowed-origins: ${FRONTEND_URL:*}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
