server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: rural-edu-backend
  datasource:
    url: ${DATABASE_URL:${MYSQL_URL:jdbc:h2:mem:ruraledudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
    username: ${DATABASE_USERNAME:${MYSQLUSER:sa}}
    password: ${DATABASE_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForRuralEduPlatformProductionMinimum256BitsLong2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ./uploads
  cors:
    allowed-origins: ${FRONTEND_URL:*}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
