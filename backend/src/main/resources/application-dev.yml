server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: rural-edu-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:rural_edu_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:RuralEduPlatformSecretKeyForJWTTokenGeneration2026SecureKeyWithMinimum256BitsLength!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ./uploads
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174,http://localhost:5178}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
