server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rural-edu-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:rural_edu_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: RuralEduPlatformSecretKeyForJWTTokenGeneration2026SecureKeyWithMinimum256BitsLength!
    expiration-ms: 86400000 # 24 Hours
  upload:
    dir: ./uploads
